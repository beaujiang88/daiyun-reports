<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f5f7;--card:#fff;--line:#e5e7eb;--text:#1f2328;--muted:#6b7280;--accent:#7c3aed;--accent2:#2563eb;--ok:#16a34a;--warn:#d97706;--danger:#dc2626}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#7c3aed,#2563eb);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.brand b{font-size:15px;display:block;line-height:1.2}
.brand span{font-size:11px;color:var(--muted)}
.progress{display:flex;align-items:center;gap:10px}
.pbar{width:130px;height:8px;background:#eef0f4;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#2563eb);border-radius:99px;transition:width .4s}
.ptext{font-size:12px;color:var(--muted)}
.reset{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
.badge-btn{border:1px solid #fde68a;background:linear-gradient(135deg,#fffbeb,#fef3c7);color:#b45309;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.badge-btn:hover{border-color:#f59e0b}
/* 勋章引导横幅 */
.kbanner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fde68a;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#92400e}
.kbanner b{font-size:13px}
.kbanner .go{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
/* 勋章墙弹窗 */
.mask{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.mask.show{display:flex}
.bwall{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:86vh;overflow-y:auto;padding:24px;position:relative;box-shadow:0 24px 60px rgba(16,24,40,.25)}
.bwall h2{font-size:19px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.bwall .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.bw-close{position:absolute;top:14px;right:16px;border:none;background:#f3f4f6;width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;color:#6b7280}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:640px){.bgrid{grid-template-columns:repeat(3,1fr)}}
.bcard{border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;transition:transform .15s;position:relative}
.bcard.unlocked{background:linear-gradient(160deg,#fffbeb,#fef9c3);border-color:#fde68a;box-shadow:0 3px 12px rgba(245,158,11,.18)}
.bcard.locked{background:#f9fafb;filter:grayscale(1);opacity:.62}
.bcard .ico{font-size:34px;line-height:1.2}
.bcard .nm{font-size:12.5px;font-weight:700;margin-top:6px;color:#1f2430}
.bcard .ds{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.bcard .lk{font-size:10.5px;color:#9ca3af;margin-top:3px;line-height:1.4}
.bcard .dt{font-size:10px;color:#b45309;margin-top:3px}
.bcard .newtag{position:absolute;top:-7px;right:-7px;background:#dc2626;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;box-shadow:0 2px 6px rgba(220,38,38,.4)}
/* 解锁庆祝 */
.celebrate{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(17,24,39,.62);backdrop-filter:blur(2px)}
.celebrate.show{display:flex}
.celebrate .card{background:linear-gradient(160deg,#fffbeb,#fef9c3);border:2px solid #f59e0b;border-radius:24px;padding:36px 44px;text-align:center;box-shadow:0 24px 70px rgba(245,158,11,.35);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.celebrate .big{font-size:72px;animation:spin 1.2s ease}
.celebrate .t1{font-size:20px;font-weight:800;color:#92400e;margin-top:10px}
.celebrate .t2{font-size:14px;color:#b45309;margin-top:6px}
.celebrate .t3{font-size:12px;color:#a16207;margin-top:8px;line-height:1.6}
.celebrate .ok{display:inline-block;margin-top:18px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:none;border-radius:999px;padding:10px 30px;font-size:14px;font-weight:700;cursor:pointer}
.celebrate .sps{font-size:26px;margin-top:12px;letter-spacing:8px}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes spin{0%{transform:scale(0) rotate(-180deg)}70%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.confetti{position:fixed;top:-12px;z-index:210;width:9px;height:16px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
.layout{display:flex;max-width:1180px;margin:0 auto;min-height:calc(100vh - 63px)}
nav{width:232px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:63px;height:calc(100vh - 63px);overflow-y:auto}
nav .nt{font-size:11px;color:var(--muted);padding:4px 10px 8px;font-weight:600}
.ch{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13px;color:#374151;border:none;background:none;width:100%;text-align:left}
.ch:hover{background:#f5f3ff}
.ch.active{background:linear-gradient(135deg,#f5f3ff,#eff6ff);color:var(--accent);font-weight:600}
.ch .n{width:20px;height:20px;border-radius:6px;background:#f3f4f6;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ch.active .n{background:var(--accent);color:#fff}
.ch.done .n{background:#ecfdf5;color:var(--ok)}
.ch .ck{margin-left:auto;font-size:12px;color:var(--ok);opacity:0}
.ch.done .ck{opacity:1}
main{flex:1;padding:22px;min-width:0}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(16,24,40,.04);margin-bottom:16px}
.hero h1{font-size:22px;display:flex;align-items:center;gap:10px}
.hero .desc{font-size:13.5px;color:var(--muted);margin-top:8px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;margin-right:6px;vertical-align:middle}
.b-ok{background:#ecfdf5;color:var(--ok)}
.b-warn{background:#fffbeb;color:var(--warn)}
.b-url{background:#eff6ff;color:var(--accent2)}
.steps{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.steps h2{font-size:16px;margin-bottom:4px}
.steps .stip{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.step{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.step-h{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;background:#fff;user-select:none}
.step-h:hover{background:#fafbfc}
.step.open .step-h{background:linear-gradient(135deg,#f5f3ff,#eff6ff)}
.sno{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step.done .sno{background:#ecfdf5;color:var(--ok)}
.sbody{flex:1;font-size:14px;font-weight:600}
.smeta{font-size:11px;color:var(--muted);font-weight:400;display:block}
.sarrow{color:#9ca3af;transition:transform .2s;flex-shrink:0}
.step.open .sarrow{transform:rotate(90deg)}
.scont{display:none;padding:4px 18px 18px 56px;border-top:1px dashed var(--line)}
.step.open .scont{display:block}
.scont p{font-size:13.5px;color:#374151;margin-bottom:10px}
.scont ol{margin:6px 0 10px 20px}
.scont li{font-size:13.5px;color:#374151;margin-bottom:5px}
.scont img{max-width:100%;border:1px solid var(--line);border-radius:10px;margin:10px 0 6px;display:block}
.scont .imgnote{font-size:11.5px;color:var(--muted);margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0 12px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f9fafb;color:var(--muted);font-weight:600}
.tip{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:11px 14px;font-size:12.5px;color:#92400e;margin-top:6px}
.tip b{display:block;margin-bottom:4px;color:#b45309}
.cb{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--ok);cursor:pointer;user-select:none}
.cb input{accent-color:var(--ok);width:15px;height:15px}
.navbtns{display:flex;justify-content:space-between;margin-top:18px}
.nbtn{border:none;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer}
.nbtn.prev{background:#fff;border:1px solid var(--line);color:var(--muted)}
.nbtn.next{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
.nbtn:disabled{opacity:.4;cursor:not-allowed}
.foot{text-align:center;font-size:11.5px;color:#9ca3af;padding:20px 0 32px}
@media(max-width:820px){
  .layout{flex-direction:column}
  nav{width:100%;position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px;padding:10px}
  nav .nt{width:100%}
  .ch{width:auto}
  main{padding:14px}
  .scont{padding-left:18px}
}

</head>

  {id:'ch08', ico:'🔍', name:'GEO 高手',   cond:'完成第 8 章「GEO推广」', ch:'08'},
  {id:'ch09', ico:'🖼️', name:'图片设计师', cond:'完成第 9 章「图片AI」', ch:'09'},
  {id:'ch10', ico:'👤', name:'账户管理员', cond:'完成第 10 章「个人中心与算力」', ch:'10'},
  {id:'ch11', ico:'💸', name:'分销合伙人', cond:'完成第 11 章「分销赚钱」', ch:'11'},
  {id:'ch12', ico:'🛠️', name:'后台管理员', cond:'完成第 12 章「租户管理后台」', ch:'12'},
  {id:'ch13', ico:'💡', name:'灵感捕手',    cond:'完成第 13 章「行业灵感库」', ch:'13'},
  {id:'ms3', ico:'⭐', name:'初级学徒',    cond:'完成任意 3 章', n:3},
  {id:'ms6', ico:'🥈', name:'进阶达人',    cond:'完成任意 6 章', n:6},
  {id:'ms9', ico:'🥇', name:'高级专家',    cond:'完成任意 9 章', n:9},
  {id:'ms13',ico:'🏆', name:'全栈大师',    cond:'完成全部 13 章', n:13},
];
let seenBadges = {};
try { seenBadges = JSON.parse(localStorage.getItem('dshBadgeSeen_v1') || '{}'); } catch(e){}

function chDone(chId){
  const c = DATA.find(x=>x.id===chId);
  if (!c) return false;
  const st = Object.keys((done[c.id]||{}).s || {}).length;
  return st >= c.steps.length && c.steps.length > 0;
}
function badgeState(){
  const chsDone = DATA.filter(c=>chDone(c.id)).length;
  return BADGES.map(b => {
    const unlocked = b.ch ? chDone(b.ch) : (chsDone >= b.n);
    return {...b, unlocked, at: unlocked ? (b.ch||'') : ''};
  });
}
function badgeCount(){ return badgeState().filter(b=>b.unlocked).length; }
function renderBadgeWall(){
  const st = badgeState();
  $('#bcnt').textContent = st.filter(b=>b.unlocked).length;
  $('#bgrid').innerHTML = st.map(b => {
    if (b.unlocked) {
      const isNew = !!seenBadges[b.id];
      return '<div class="bcard unlocked"><div class="ico">' + b.ico + '</div>'
        + '<div class="nm">' + b.name + '</div><div class="ds">' + b.cond + '</div>'
        + (isNew ? '<div class="dt">🎁 新解锁</div>' : '')
        + (isNew ? '<span class="newtag">NEW</span>' : '') + '</div>';
    }
    return '<div class="bcard locked"><div class="ico">' + b.ico + '</div>'
      + '<div class="nm">' + b.name + '</div><div class="lk">🔒 ' + b.cond + '</div></div>';
  }).join('');
}
function openBadgeWall(){
  renderBadgeWall();
  $('#badgeWall').classList.add('show');
}
function closeBadgeWall(){ $('#badgeWall').classList.remove('show'); }

/* 解锁庆祝：markStep 后调用，检查新解锁勋章 */
function checkNewBadges(){
  let fresh = badgeState().filter(b=>b.unlocked && !seenBadges[b.id]);
  if (!fresh.length) { renderBadgeWall(); return; }
  // 逐个弹（一次弹第一个，关闭后弹下一个）
  const b = fresh[0];
  seenBadges[b.id] = true;
  localStorage.setItem('dshBadgeSeen_v1', JSON.stringify(seenBadges));
  renderBadgeWall();
  $('#ce-big').textContent = b.ico;
  $('#ce-name').textContent = '🎖️ 解锁勋章：' + b.name;
  $('#ce-desc').textContent = b.cond;
  $('#ce-tip').textContent = '已解锁 ' + badgeCount() + ' / 17 枚 · 继续加油，集齐成为「数果AI 全栈大师」！';
  $('#celebrate').classList.add('show');
  fireConfetti();
  window._pendingBadges = fresh.slice(1);
}
function closeCelebrate(){
  $('#celebrate').classList.remove('show');
  if (window._pendingBadges && window._pendingBadges.length) {
    const next = window._pendingBadges[0];
    window._pendingBadges = window._pendingBadges.slice(1);
    seenBadges[next.id] = true;
    localStorage.setItem('dshBadgeSeen_v1', JSON.stringify(seenBadges));
    renderBadgeWall();
    $('#ce-big').textContent = next.ico;
    $('#ce-name').textContent = '🎖️ 解锁勋章：' + next.name;
    $('#ce-desc').textContent = next.cond;
    $('#ce-tip').textContent = '已解锁 ' + badgeCount() + ' / 17 枚 · 继续加油！';
    $('#celebrate').classList.add('show');
    fireConfetti();
  }
}
function fireConfetti(){
  const colors = ['#f59e0b','#7c3aed','#2563eb','#16a34a','#dc2626','#f472b6'];
  for (let i=0;i<40;i++){
    const d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = Math.random()*100 + 'vw';
    d.style.background = colors[i%colors.length];
    d.style.animationDuration = (1.6 + Math.random()*1.6) + 's';
    d.style.animationDelay = (Math.random()*0.5) + 's';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 3800);
  }
}

/* ============ 渲染逻辑 ============ */
const LS_KEY = 'dshTutorialDone_v1';
let cur = 0;          // 当前章节
let openStep = -1;    // 当前展开步骤（-1 无）
let done = {};        // {chId: {s: {stepIdx: true}}}
try { done = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch(e){}

const $ = s => document.querySelector(s);

function totalSteps(){ return DATA.reduce((a,c)=>a+c.steps.length,0); }
function doneCount(){
  let n = 0;
  DATA.forEach(c=>{ const s = (done[c.id]||{}).s||{}; Object.keys(s).forEach(()=>n++); });
  return n;
}
function updateProgress(){
  const total = totalSteps(), dn = doneCount();
  $('#pfill').style.width = (total ? dn/total*100 : 0) + '%';
  $('#ptext').textContent = dn + ' / ' + total + ' 步';
}
function renderChapters(){
  $('#chapters').innerHTML = '<div class="nt">教程目录（13 章）</div>' + DATA.map((c, i) => {
    const st = Object.keys((done[c.id]||{}).s || {}).length;
    const all = st === c.steps.length && c.steps.length > 0;
    return '<button class="ch' + (i===cur?' active':'') + (all?' done':'') + '" onclick="goChapter(' + i + ')">'
      + '<span class="n">' + (i+1) + '</span>' + c.title + '<span class="ck">✓</span></button>';
  }).join('');
}
function goChapter(i){
  cur = i; openStep = -1;
  renderChapters(); renderView();
  window.scrollTo({top:0});
}
function openStepAt(i){
  openStep = openStep === i ? -1 : i;
  renderView(false);
}
function markStep(ch, si){
  done[ch] = done[ch] || { s:{} };
  if (done[ch].s[si]) delete done[ch].s[si]; else done[ch].s[si] = true;
  localStorage.setItem(LS_KEY, JSON.stringify(done));
  updateProgress(); renderChapters(); renderView(false);
  checkNewBadges();
}
function resetAll(){
  if(!confirm('确认清空全部学习进度？')) return;
  done = {}; localStorage.removeItem(LS_KEY);
  seenBadges = {}; localStorage.removeItem('dshBadgeSeen_v1');
  updateProgress(); renderChapters(); renderView(); renderBadgeWall();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderView(scroll){
  const c = DATA[cur];
  const stepsHtml = c.steps.map((s, i) => {
    const isOpen = openStep === i;
    const isDone = !!((done[c.id]||{}).s||{})[i];
    const tbl = s.table ? '<table>' + s.table.map((r, ri) => '<tr>' + r.map(cell => ri===0?'<th>'+esc(cell)+'</th>':'<td>'+esc(cell)+'</td>').join('') + '</tr>').join('') + '</table>' : '';
    const img = s.image ? '<img src="' + s.image + '" alt="' + esc(s.t) + '">' : '';
    const note = s.imageNote ? '<div class="imgnote">📷 ' + esc(s.imageNote) + '</div>' : '';
    const tip = s.tip ? '<div class="tip">' + esc(s.tip) + '</div>' : '';
    return '<div class="step' + (isOpen?' open':'') + (isDone?' done':'') + '">'
      + '<div class="step-h" onclick="openStepAt(' + i + ')">'
      + '<div class="sno">' + (isDone?'✓':(i+1)) + '</div>'
      + '<div class="sbody">' + esc(s.t) + '<span class="smeta">' + esc(s.d||'') + '</span></div>'
      + '<span class="sarrow">▶</span></div>'
      + '<div class="scont">' + (s.detail?'<p>'+esc(s.detail)+'</p>':'') + tbl + img + note + tip
      + '<label class="cb"><input type="checkbox" ' + (isDone?'checked':'') + ' onchange="markStep(\'' + c.id + '\',' + i + ')"> 标记这一步已完成</label>'
      + '</div></div>';
  }).join('');
  const tipsHtml = c.tips ? '<div class="tip" style="background:#fef2f2;border-color:#fecaca;color:#991b1b"><b>⚠️ 避坑清单</b>' + c.tips.map(t=>'· '+esc(t)).join('<br>') + '</div>' : '';
  const imgTop = c.image ? '<div style="margin-top:14px"><img src="' + c.image + '" alt="示意" style="max-width:100%;border:1px solid var(--line);border-radius:10px"><div class="imgnote">📷 ' + esc(c.imageNote) + '</div></div>' : '';
  $('#view').innerHTML =
    '<div class="kbanner"><span>🏆 <b>勋章成就系统</b>：完成教程步骤解锁勋章（' + badgeCount() + '/17 枚），学完一章点亮一枚，集齐成为「数果AI 全栈大师」</span><button class="go" onclick="openBadgeWall()">查看勋章墙 →</button></div>'
    + '<div class="hero"><h1>' + c.icon + ' ' + esc(c.title) + '</h1>'
    + '<div style="margin-top:8px"><span class="badge b-ok">✅ ' + esc(c.status) + '</span><span class="badge b-url">🔗 ' + esc(c.url) + '</span></div>'
    + '<div class="desc">' + esc(c.desc) + '</div>' + imgTop + '</div>'
    + '<div class="steps"><h2>分步操作（点击每步展开）</h2><div class="stip">共 ' + c.steps.length + ' 步 · 点击步骤卡片展开详细说明与配图 · 底部可标记完成</div>'
    + stepsHtml + tipsHtml + '</div>'
    + '<div class="navbtns">'
    + '<button class="nbtn prev" onclick="navStep(-1)" ' + (cur===0 && openStep<0 ? 'disabled':'') + '>← 上一步</button>'
    + '<button class="nbtn next" onclick="navStep(1)">下一步 →</button>'
    + '</div>';
  updateProgress(); renderChapters();
  if (scroll !== false) window.scrollTo({top:0});
}
/* 上一步/下一步：先跨步骤，章末跨章 */
function navStep(dir){
  const c = DATA[cur];
  if (dir === 1) {
    if (openStep < c.steps.length - 1) { openStepAt(openStep + 1); return; }
    if (cur < DATA.length - 1) { cur++; openStep = 0; renderChapters(); renderView(); return; }
    return;
  }
  if (openStep > 0) { openStepAt(openStep - 1); return; }
  if (cur > 0) { cur--; openStep = DATA[cur].steps.length - 1; renderChapters(); renderView(); return; }
}
renderBadgeWall();
goChapter(0);
</script>
</body>
</html>
