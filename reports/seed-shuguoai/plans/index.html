.tw{margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--card);

th{background:#f0f4fa;font-weight:600}
tr:last-child td{border-bottom:none}
td:first-child,th:first-child{width:1%}
hr{border:none;border-top:1px dashed var(--line);margin:30px 0}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);color:var(--sub);font-size:12.5px;line-height:1.9}
/* 手机上优先保证字号与可读性，绝不出现缩小字体 */
@media (max-width:640px){
  body{font-size:16.5px}
  .wrap{padding:20px 14px 72px}
  header h1{font-size:20px}
  h2{font-size:18px}
  h3{font-size:16.5px}
  /* 表格 → 卡片式：每行变一张卡，表头用 data-label 内联 */
  table,tbody,tr,td{display:block;width:100%}
  table{border:none;background:none}
  thead{display:none}
  tr{background:var(--card);border:1px solid var(--line);border-radius:10px;
     padding:10px 12px;margin:0 0 10px}
  td{border:none;border-bottom:1px dashed var(--line);padding:6px 0;font-size:16px}
  td:last-child{border-bottom:none}
  td:first-child{width:auto}
  td.lab{font-size:14px;font-weight:700;color:var(--accent2);padding-bottom:2px;border-bottom:none}
  td::before{content:attr(data-label);display:block;font-size:12px;color:var(--sub);
             font-weight:600;margin-bottom:2px}
  td.lab::before,td:not([data-label])::before{content:none}
}
@media print{body{background:#fff}.wrap{max-width:none;padding:0}}

.planlist{display:grid;gap:12px;margin:18px 0}

border:1px solid #f3d9cd;border-radius:20px;padding:2px 9px}
